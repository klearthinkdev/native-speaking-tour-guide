<button
  [matMenuTriggerFor]="langMenu"
  [matTooltip]="'COMPONENTS.LANG_SWITCH' | translate"
  mat-icon-button
  type="button"
>
  <mat-icon>language</mat-icon>
</button>

<mat-menu #langMenu="matMenu">
  @for (option of langOptionList; track $index) {
  <button
    [class.activated]="option.value === tr.currentLang"
    (click)="onSelectLang(option.value)"
    mat-menu-item
    type="button"
  >
    {{ option.label }}
  </button>
  }
</mat-menu>
