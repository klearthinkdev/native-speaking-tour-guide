<div class="flex items-start text-base">
  @if (fontIcon) {
    <mat-icon class="mr-2 shrink-0" [fontIcon]="fontIcon"></mat-icon>
  }

  <div>{{ data.message }}</div>
</div>

<mat-progress-bar
  class="absolute right-0 bottom-0 left-0 rounded-br-sm rounded-bl-sm"
  [value]="progress"
  mode="determinate"
></mat-progress-bar>
